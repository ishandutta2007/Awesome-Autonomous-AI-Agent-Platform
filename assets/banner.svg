<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 52px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 22px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
    }
    
    /* Subtle background dynamic elements */
    @keyframes pulseParticle {
      0% { opacity: 0.2; transform: scale(0.98); }
      50% { opacity: 0.6; transform: scale(1.02); }
      100% { opacity: 0.2; transform: scale(0.98); }
    }
    @keyframes floatNode {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    .animated-bg {
      animation: pulseParticle 6s ease-in-out infinite;
      transform-origin: center;
    }
    .node-float {
      animation: floatNode 4s ease-in-out infinite;
    }
  </style>

  <!-- Base Layer Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)" rx="16" />

  <!-- Animated Grid Overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200 M0 350 H1200" />
    <path d="M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400 M600 0 V400 M700 0 V400 M800 0 V400 M900 0 V400 M1000 0 V400 M1100 0 V400" />
  </g>

  <!-- Background Dynamic Glowing Nodes (Behind text) -->
  <g class="animated-bg" opacity="0.4">
    <!-- Connecting Network Lines -->
    <path d="M 150 100 L 300 80 L 450 120 L 900 80 L 1050 130" stroke="url(#cyanGlow)" stroke-width="1.5" stroke-dasharray="6,6" fill="none" />
    <path d="M 100 300 L 250 320 L 600 340 L 950 310 L 1100 280" stroke="url(#primaryGlow)" stroke-width="1.5" stroke-dasharray="4,4" fill="none" />
    
    <!-- Glowing Orbs -->
    <circle cx="150" cy="100" r="30" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
    <circle cx="1050" cy="130" r="40" fill="#ec4899" opacity="0.15" filter="url(#glow)" />
    <circle cx="950" cy="310" r="35" fill="#06b6d4" opacity="0.15" filter="url(#glow)" />
  </g>

  <!-- Foreground Title and Subtitle Block -->
  <g transform="translate(60, 0)">
    <!-- Category Pill -->
    <g transform="translate(0, 75)">
      <rect width="260" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="20" cy="17" r="6" fill="#10b981" />
      <text x="36" y="22" class="badge-text">AUTONOMOUS AI AGENTS 🤖</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="175" class="title">
      Awesome Autonomous
    </text>
    <text x="0" y="235" class="title" fill="url(#primaryGlow)">
      AI Agent Platforms 🚀
    </text>

    <!-- Subtitle -->
    <text x="0" y="295" class="subtitle">
      Curated Multi-Agent Orchestration Frameworks, Visual Builders &amp; Enterprise Runtimes
    </text>

    <!-- Tech Stack Pills -->
    <g transform="translate(0, 330)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#334155" opacity="0.6" />
      <text x="12" y="19" font-family="sans-serif" font-size="12" fill="#e2e8f0">Multi-Agent</text>
      
      <!-- Pill 2 -->
      <rect x="140" y="0" width="150" height="28" rx="6" fill="#334155" opacity="0.6" />
      <text x="152" y="19" font-family="sans-serif" font-size="12" fill="#e2e8f0">Agentic Workflows</text>
      
      <!-- Pill 3 -->
      <rect x="300" y="0" width="140" height="28" rx="6" fill="#334155" opacity="0.6" />
      <text x="312" y="19" font-family="sans-serif" font-size="12" fill="#e2e8f0">Visual Orchestration</text>

      <!-- Pill 4 -->
      <rect x="450" y="0" width="120" height="28" rx="6" fill="#334155" opacity="0.6" />
      <text x="462" y="19" font-family="sans-serif" font-size="12" fill="#e2e8f0">Self-Hosted</text>
    </g>
  </g>
</svg>
